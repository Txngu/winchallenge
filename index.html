<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0b0a1a;--panel:rgba(255,255,255,.055);--line:rgba(255,255,255,.12);--tx:#ecebff;--mut:#9a97c4;--pur:#8b5cf6;--blu:#38bdf8;--grn:#34d399;--yel:#fbbf24;--red:#f87171;--cy:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 15% -10%,#2a1b6b,transparent),radial-gradient(800px 500px at 100% 0,#10325c,transparent),var(--bg);color:var(--tx);font:400 15px/1.45 'Chakra Petch',system-ui,sans-serif;min-height:100vh;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:linear-gradient(135deg,var(--pur),#5b6cf6);border:0;border-radius:8px;padding:6px 12px;font-weight:600}button.g{background:var(--panel);border:1px solid var(--line)}button.d{background:#7f1d1d}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
input,select{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.wrap{max-width:1280px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(10px)}
.hero{text-align:center;margin:14px 0;padding:22px 14px;background:linear-gradient(180deg,rgba(139,92,246,.18),rgba(56,189,248,.06))}
#clock{font-size:clamp(40px,9vw,92px);font-weight:700;letter-spacing:.02em;line-height:1;text-shadow:0 0 30px rgba(139,92,246,.7)}
.grid{display:grid;grid-template-columns:1fr 330px;gap:14px}@media(max-width:960px){.grid{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:8px}.card h3{margin:0;font-size:18px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.chip{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--line)}.s-active{border-color:var(--grn);color:var(--grn)}.s-waiting{border-color:var(--yel);color:var(--yel)}.s-completed{border-color:var(--cy);color:var(--cy)}.s-not_started{border-color:var(--red);color:var(--red)}
.bar{height:10px;background:rgba(0,0,0,.4);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pur),var(--blu));transition:width .7s cubic-bezier(.2,.8,.2,1)}.bar.done i{background:linear-gradient(90deg,#10b981,var(--grn))}
.obj{display:flex;flex-direction:column;gap:3px}.mut{color:var(--mut);font-size:13px}.ok{color:var(--grn)}
table{width:100%;border-collapse:collapse}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
.lb li{list-style:none;display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.lb{padding:0;margin:8px 0}
#modal{position:fixed;inset:0;background:rgba(5,4,15,.75);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:5}#modal.on{display:flex}#modal .panel{background:#14122d;max-width:620px;width:100%}
.auth{max-width:380px;margin:12vh auto}.auth form{display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#3b1d5c;border:1px solid var(--pur);padding:8px 16px;border-radius:10px;display:none;z-index:9;max-width:90vw}
.pn{border-bottom:1px dotted var(--blu);cursor:help}#pimg{position:fixed;display:none;z-index:20;max-width:220px;max-height:220px;border-radius:12px;border:2px solid var(--pur);box-shadow:0 8px 30px rgba(0,0,0,.6);pointer-events:none;background:#14122d}
h2{font-size:17px;margin:0 0 8px}.log{max-height:260px;overflow:auto;font-size:12px}@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script>
/* ====== 1. PASTE YOUR SUPABASE VALUES HERE (Project Settings > API). Use the anon/public key only. ====== */
const SUPABASE_URL = 'https://enuporifxxwfwhgpcqdo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7dRuMHfaD9Mdhyj1lvZOUg_arxnEwE7';
/* ======================================================================================================= */
/* ====== 2. HOVER PHOTOS: add a player here. Key = their username OR display name, in lowercase. Value = image path or full URL. ====== */
const PLAYER_IMAGES = {
  risel: 'https://enuporifxxwfwhgpcqdo.supabase.co/storage/v1/object/public/website-assets/sven.png'
};
/* ======================================================================================================= */
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = {ins:[],prog:[],parts:[],contrib:[],lb:[],vc:[],mv:[],profiles:[],names:{},online:[],log:[],hist:[],open:null,metric:'mvp',mode:'in'}, off = 0, me = null, chOnline = null, timer = null;
const ST = {active:'🟢 Active',waiting:'🟡 Waiting',completed:'🔵 Completed',not_started:'🔴 Not started'};
const isAdm = () => S.me?.role === 'admin';
const nmp = id => esc(S.names[id] || 'Unknown');
const imgFor = p => { if (!p) return null; const names = [p.username, p.display_name].map(x => String(x || '').toLowerCase().trim()); const k = Object.keys(PLAYER_IMAGES).find(k => names.some(x => x === k || x.includes(k))); return k ? PLAYER_IMAGES[k] : null; };
const nm = id => { const p = S.profiles.find(x => x.id === id); const img = imgFor(p); return img ? `<span class="pn" data-img="${esc(img)}">${esc(p.display_name)}</span>` : nmp(id); };
const p2 = n => String(n).padStart(2,'0');
function fmt(sec){sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;return (d?p2(d)+':':'')+p2(h)+':'+p2(m)+':'+p2(s);}
function elapsed(w){if(!w||!w.started_at)return 0;if(w.status==='completed')return w.elapsed_seconds||0;const now=w.status==='paused'?new Date(w.paused_at).getTime():Date.now()+off;return (now-new Date(w.started_at).getTime())/1000-w.paused_seconds;}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500);}
async function R(fn,args){const {error}=await db.rpc(fn,args);if(error){toast(error.message);return false;}await load();if(S.open)await hist();return true;}
const act = id => S.parts.filter(p=>p.challenge_instance_id===id&&!p.left_at);
const prog = (id,k) => S.prog.find(p=>p.challenge_instance_id===id&&p.progression_key===k);
const money = n => '§'+Number(n).toLocaleString('en-US');

/* ---------- auth ---------- */
function authView(){
  $('#app').innerHTML=`<div class="panel auth"><h1 style="margin:0 0 4px">Win Challenge</h1><p class="mut">${S.mode==='in'?'Log in to join the run.':'Create your account.'}</p>
  <form id="af">${S.mode==='up'?'<input id="un" placeholder="Username (letters, numbers, _)" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"><input id="dn" placeholder="Display name" required maxlength="40">':''}
  <input id="em" type="email" placeholder="Email" required autocomplete="email"><input id="pw" type="password" placeholder="Password (min 8 characters)" required minlength="8" autocomplete="${S.mode==='in'?'current-password':'new-password'}">
  <button>${S.mode==='in'?'Log in':'Create account'}</button></form>
  <p><button class="g" id="sw">${S.mode==='in'?'I need an account':'I already have an account'}</button></p></div>`;
  $('#sw').onclick=()=>{S.mode=S.mode==='in'?'up':'in';authView();};
  $('#af').onsubmit=async e=>{e.preventDefault();const email=$('#em').value.trim(),password=$('#pw').value;
    if(S.mode==='in'){const {error}=await db.auth.signInWithPassword({email,password});if(error)toast(error.message);}
    else{const {data,error}=await db.auth.signUp({email,password,options:{data:{username:$('#un').value.trim(),display_name:$('#dn').value.trim()}}});
      if(error)toast(error.message);else if(!data.session){toast('Account created. Check your email to confirm it, then log in.');S.mode='in';authView();}}};
}

/* ---------- data ---------- */
let _t=null;const sched=()=>{clearTimeout(_t);_t=setTimeout(load,250);};
async function load(){
  const [w,pr,lb,vc,mv,tn]=await Promise.all([db.from('win_challenges').select('*').order('created_at',{ascending:false}).limit(1),db.from('profiles').select('*'),db.from('leaderboard').select('*'),db.from('vote_counts').select('*'),db.from('votes').select('challenge_instance_id,vote_type').eq('voter_id',me.id),db.rpc('server_now')]);
  S.win=w.data?.[0]||null;S.profiles=pr.data||[];S.lb=lb.data||[];S.vc=vc.data||[];S.mv=mv.data||[];
  S.me=S.profiles.find(p=>p.id===me.id);S.names=Object.fromEntries(S.profiles.map(p=>[p.id,p.display_name]));
  if(tn.data)off=new Date(tn.data).getTime()-Date.now();
  S.ins=[];S.prog=[];S.parts=[];S.contrib=[];
  if(S.win){const r=await db.from('challenge_instances').select('*').eq('win_challenge_id',S.win.id).order('sort_order');S.ins=r.data||[];const ids=S.ins.map(i=>i.id);
    if(ids.length){const [a,b,c]=await Promise.all([db.from('challenge_progress').select('*').in('challenge_instance_id',ids),db.from('challenge_participants').select('*').in('challenge_instance_id',ids),db.from('challenge_contributions').select('*').in('challenge_instance_id',ids)]);S.prog=a.data||[];S.parts=b.data||[];S.contrib=c.data||[];}}
  if(isAdm()){const l=await db.from('activity_log').select('*').order('created_at',{ascending:false}).limit(60);S.log=l.data||[];}
  render();
}
async function hist(){S.hist=(await db.from('progress_history').select('*').eq('challenge_instance_id',S.open).order('created_at',{ascending:false}).limit(40)).data||[];render();}

/* ---------- progress maths ---------- */
function oPct(i,o){
  if(o.type==='team_total'){const s=S.contrib.filter(c=>c.challenge_instance_id===i.id).reduce((a,c)=>a+Number(c.amount),0);return Math.min(1,s/o.target);}
  if(o.type==='each_player'){const ps=act(i.id);if(!ps.length)return 0;return ps.reduce((a,p)=>a+Math.min(1,Number(S.contrib.find(c=>c.challenge_instance_id===i.id&&c.user_id===p.user_id)?.amount||0)/o.target),0)/ps.length;}
  const v=Number(prog(i.id,o.key)?.current_value||0);
  if(o.type==='lte'){if(o.start&&v>0)return Math.max(0,Math.min(1,(o.start-v)/(o.start-o.target)));return v>0&&v<=o.target?1:0;}
  return Math.min(1,v/o.target);
}
const iPct = i => { const a=i.progression_schema.map(o=>oPct(i,o)); return a.length?a.reduce((x,y)=>x+y,0)/a.length:0; };
const bar = p => `<div class="bar ${p>=1?'done':''}"><i style="width:${Math.round(p*100)}%"></i></div>`;

function objHTML(i){
  return i.progression_schema.map(o=>{
    const pc=oPct(i,o),done=pc>=1,v=Number(prog(i.id,o.key)?.current_value||0),meta=prog(i.id,o.key)?.metadata||{};let line='';
    if(o.type==='counter')line=`${v} / ${o.target}${done?'':` <span class="mut">(${o.target-v} to go)</span>`}`;
    else if(o.type==='flag')line=v>=1?'YES ✅':'NO <span class="mut">(required)</span>';
    else if(o.type==='streak')line=`Current ${v} / ${o.target} <span class="mut">· Best ${meta.best||0} · Resets ${meta.fails||0}${done?'':` · ${o.target-v} more in a row`}</span>`;
    else if(o.type==='money')line=`${money(v)} / ${money(o.target)} <span class="mut">(${(pc*100).toFixed(2)}%)</span>${i.time_limit_seconds&&i.started_at&&!done?` <b class="sims" data-end="${new Date(i.started_at).getTime()+i.time_limit_seconds*1000}"></b>`:''}`;
    else if(o.type==='lte')line=v>0?`${esc(o.prefix||'')}${v} <span class="mut">(target ${esc(o.prefix||'')}${o.target}${o.start&&v>o.target?` · ${v-o.target} to go`:''})</span>${done?' ✅':''}`:`Not set <span class="mut">(target ${esc(o.prefix||'')}${o.target} or better)</span>`;
    else if(o.type==='team_total'){const rows=S.contrib.filter(c=>c.challenge_instance_id===i.id);const s=rows.reduce((a,c)=>a+Number(c.amount),0);
      line=`${s} / ${o.target}<table>${rows.map(c=>`<tr><td>${nm(c.user_id)}</td><td>${c.amount}</td></tr>`).join('')}</table>`;}
    else if(o.type==='each_player'){line='<table>'+act(i.id).map(p=>{const c=S.contrib.find(c=>c.challenge_instance_id===i.id&&c.user_id===p.user_id);const a=Number(c?.amount||0);return `<tr><td>${nm(p.user_id)}</td><td>${esc(c?.note||'—')}</td><td>${a} / ${o.target}</td><td>${a>=o.target?'🟢':'🔴'}</td></tr>`;}).join('')+'</table>';}
    return `<div class="obj"><div class="row sp"><span>${esc(o.label)}</span><span>${line}</span></div>${bar(pc)}</div>`;}).join('');
}

function card(i){
  const ps=act(i.id),mine=ps.some(p=>p.user_id===me.id),adm=isAdm(),run=S.win?.status==='running';
  const allU=[...new Set(S.parts.filter(p=>p.challenge_instance_id===i.id).map(p=>p.user_id))];
  const miss=Math.max(0,i.min_players-ps.length);
  let vote='';
  if(i.status==='completed'){
    const top=t=>{const r=S.vc.filter(v=>v.challenge_instance_id===i.id&&v.vote_type===t).sort((a,b)=>b.n-a.n)[0];return r?`${nm(r.target_user_id)} — ${r.n} vote${r.n>1?'s':''}`:'no votes yet';};
    const voted=t=>S.mv.some(v=>v.challenge_instance_id===i.id&&v.vote_type===t);
    const form=(t,l)=>voted(t)?`<span class="mut">${l} vote cast ✔</span>`:`<span class="row"><select id="v-${t}-${i.id}">${allU.filter(u=>u!==me.id).map(u=>`<option value="${u}">${nmp(u)}</option>`).join('')}</select><button data-a="vote" data-i="${i.id}" data-t="${t}">Vote ${l}</button></span>`;
    vote=`<div>🏆 MVP: <b>${top('MVP')}</b><br>🪨 Most Carried: <b>${top('MOST_CARRIED')}</b></div>${allU.includes(me.id)?form('MVP','MVP')+form('MOST_CARRIED','Most Carried'):''}`;
  }
  return `<div class="panel card"><div class="row sp"><h3>${esc(i.icon)} ${esc(i.name)}${i.optional?' <span class="chip">Optional</span>':''}</h3><span class="chip s-${i.status}">${ST[i.status]}</span></div>
  <div class="row sp mut"><span>${esc(i.category)}</span><span>Players ${ps.length} / ${i.min_players===i.max_players?i.max_players:i.min_players+'–'+i.max_players}</span></div>
  ${i.description?`<div class="mut">${esc(i.description)}</div>`:''}<div class="row sp"><b>${Math.round(iPct(i)*100)}%</b><div style="flex:1">${bar(iPct(i))}</div></div>${objHTML(i)}
  <div class="mut">${ps.length?'Playing: '+ps.map(p=>nm(p.user_id)).join(', '):'Nobody has joined yet'}${miss&&ps.length?` · waiting for ${miss} more`:''}</div>
  ${i.status==='completed'?`<div class="mut">Finished at ${fmt(i.elapsed_seconds||0)} · ${new Date(i.completed_at).toLocaleString()}</div>`:''}${vote}
  <div class="row">${i.status!=='completed'&&run?(mine?`<button class="g" data-a="leave" data-i="${i.id}">Leave</button>`:`<button data-a="join" data-i="${i.id}">Join</button>`):''}
  <button class="g" data-a="open" data-i="${i.id}">${i.status==='completed'?'History':'Update progress'}</button>
  ${adm&&i.status!=='completed'?`<button class="g" data-a="addall" data-i="${i.id}">Add everyone</button><button class="g" data-a="force" data-i="${i.id}">Mark complete</button>`:''}
  ${adm&&i.status==='completed'?`<button class="g" data-a="reopen" data-i="${i.id}">Undo completion</button>`:''}${adm&&i.status!=='completed'?`<button class="d" data-a="reset" data-i="${i.id}">Reset</button>`:''}</div></div>`;
}

function render(){
  if(!me)return;const tp=$('#pimg');if(tp)tp.style.display='none';const w=S.win,adm=isAdm();
  const req=S.ins.filter(i=>!i.optional),done=req.filter(i=>i.status==='completed').length,tot=req.length;
  const st={draft:'⚪ Ready to start',running:'🟢 In progress',paused:'⏸️ Paused',completed:'🏁 Finished'}[w?.status]||'No Win Challenge yet';
  const metric=S.metric,rate=u=>u.participated?u.mvp/u.participated:0;
  const lb=[...S.lb].sort((a,b)=>(metric==='rate'?rate(b)-rate(a):b[metric]-a[metric])||a.display_name.localeCompare(b.display_name));
  const val=u=>metric==='rate'?(rate(u)*100).toFixed(0)+'%':u[metric];
  const medal=['🥇','🥈','🥉'];
  const grp=(t,f)=>S.ins.filter(f).map(card).join('');
  const activeC=grp('a',i=>['active','waiting'].includes(i.status)),todo=grp('t',i=>i.status==='not_started'),fin=S.ins.filter(i=>i.status==='completed').sort((a,b)=>new Date(b.completed_at)-new Date(a.completed_at)).map(card).join('');
  $('#app').innerHTML=`<div class="wrap"><div class="top"><b style="font-size:20px">⚔️ Win Challenge</b><div class="row"><span class="mut">${esc(S.me?.display_name||'')}${adm?' · admin':''}</span><button class="g" data-a="logout">Log out</button></div></div>
  <div class="panel hero"><div class="mut">${esc(w?.name||'')} · ${st}</div><div id="clock">${fmt(elapsed(w))}</div>
  ${w?.started_at?`<div class="mut">Started ${new Date(w.started_at).toLocaleString()}${w.completed_at?` · Finished ${new Date(w.completed_at).toLocaleString()}`:''}</div>`:''}
  <div style="max-width:560px;margin:12px auto 0"><div class="row sp"><span>${done} / ${tot} challenges completed</span><span>${tot?Math.round(done/tot*100):0}%</span></div>${bar(tot?done/tot:0)}</div>
  ${adm?`<div class="row" style="justify-content:center;margin-top:12px">${!w||w.status==='completed'?'<button data-a="create">Create Win Challenge</button>':''}${w?.status==='draft'?'<button data-a="wa" data-w="start">Start timer</button>':''}${w?.status==='running'?'<button class="g" data-a="wa" data-w="pause">Pause</button>':''}${w?.status==='paused'?'<button data-a="wa" data-w="resume">Resume</button>':''}${['running','paused'].includes(w?.status)?'<button class="d" data-a="wa" data-w="end">End challenge</button>':''}</div>`:''}</div>
  <div class="grid"><div>${!w?`<div class="panel">${adm?'Create a Win Challenge to begin.':'Waiting for the admin to create the Win Challenge.'}</div>`:`
   <h2>Active and waiting</h2><div class="cards">${activeC||'<div class="panel mut">Nothing is being played right now. Join a challenge below.</div>'}</div>
   <h2 style="margin-top:18px">Not started</h2><div class="cards">${todo||'<div class="panel mut">Every challenge has been picked up.</div>'}</div>
   <h2 style="margin-top:18px">Completed</h2><div class="cards">${fin||'<div class="panel mut">No completed challenges yet.</div>'}</div>`}</div>
  <div style="display:flex;flex-direction:column;gap:14px">
   <div class="panel"><h2>Leaderboard</h2><select id="metric">${[['mvp','🏆 MVP votes'],['carried','🪨 Most Carried'],['rate','MVP rate'],['participated','Completed challenges played']].map(([k,l])=>`<option value="${k}" ${k===metric?'selected':''}>${l}</option>`).join('')}</select>
    <ol class="lb">${lb.map((u,n)=>`<li><span>${medal[n]||n+1+'.'} ${nm(u.user_id)}</span><b>${val(u)}</b></li>`).join('')}</ol><div class="mut">Challenge wins = completed challenges you took part in.</div></div>
   <div class="panel"><h2>Online now</h2>${S.online.length?S.online.map(id=>`<div>🟢 ${nm(id)}</div>`).join(''):'<span class="mut">Just you.</span>'}</div>
   ${adm?`<div class="panel"><h2>Players</h2>${S.profiles.map(p=>`<div class="row sp"><span>${nm(p.id)} <span class="mut">@${esc(p.username)}</span></span>${p.id!==me.id?`<button class="g" data-a="role" data-u="${p.id}" data-r="${p.role==='admin'?'player':'admin'}">${p.role==='admin'?'Remove admin':'Make admin'}</button>`:'<span class="mut">you</span>'}</div>`).join('')}</div>
   <div class="panel"><h2>Activity log</h2><div class="log">${S.log.map(l=>`<div><span class="mut">${new Date(l.created_at).toLocaleTimeString()}</span> ${nm(l.user_id)} · ${esc(l.action)} ${esc(JSON.stringify(l.metadata))}</div>`).join('')}</div></div>`:''}
  </div></div></div>`;
  $('#metric').onchange=e=>{S.metric=e.target.value;render();};
  renderModal();tick();
}

function renderModal(){
  const m=$('#modal'),i=S.ins.find(x=>x.id===S.open);
  if(!i){m.classList.remove('on');m.innerHTML='';return;}
  if(m.contains(document.activeElement)&&/INPUT|SELECT/.test(document.activeElement.tagName))return;
  m.classList.add('on');const ps=act(i.id),opts=ps.map(p=>`<option value="${p.user_id}">${nmp(p.user_id)}</option>`).join(''),lock=i.status==='completed';
  const ctl=i.progression_schema.map(o=>{const v=Number(prog(i.id,o.key)?.current_value||0),k=`data-i="${i.id}" data-k="${o.key}"`;let c='';
    if(lock)return '';
    if(o.type==='counter'&&o.target>=50)c=`<input id="in-${o.key}" type="number" min="0" value="${v}" style="width:110px"><button data-a="set" ${k}>Save</button><span class="mut">/ ${o.target}</span>`;
    else if(o.type==='counter')c=`<button class="g" data-a="inc" ${k} data-v="-1">−</button><b>${v}</b><button data-a="inc" ${k} data-v="1">+</button><span class="mut">/ ${o.target}</span>`;
    else if(o.type==='flag')c=`<button class="${v>=1?'':'g'}" data-a="set" ${k} data-v="${v>=1?0:1}">${v>=1?'YES ✅ (tap to undo)':'Mark as done'}</button>`;
    else if(o.type==='streak')c=`<button data-a="win" ${k}>Win +1</button><button class="d" data-a="loss" ${k}>Loss (reset streak)</button><span class="mut">${v} / ${o.target}</span>`;
    else if(o.type==='money'||o.type==='lte')c=`<input id="in-${o.key}" type="number" min="0" value="${v}" style="width:120px"><button data-a="set" ${k}>Save</button>`;
    else if(o.type==='team_total')c=`<select id="pl">${opts}</select><input id="amt" type="number" min="0.1" step="any" value="1" style="width:80px"><button data-a="contrib" data-i="${i.id}" data-m="add">Add</button>`;
    else c=`<select id="pl">${opts}</select><input id="amt" type="number" min="0" step="any" value="1" style="width:80px"><input id="lang" placeholder="Note (optional)" style="width:130px"><button data-a="contrib" data-i="${i.id}" data-m="set">Set</button>`;
    return `<div class="obj"><span>${esc(o.label)}</span><div class="row">${c}</div></div>`;}).join('');
  const lab=k=>k.startsWith('player:')?'Contribution by '+nm(k.slice(7)):esc(i.progression_schema.find(o=>o.key===k)?.label||k);
  m.innerHTML=`<div class="panel"><div class="row sp"><h2>${esc(i.icon)} ${esc(i.name)}</h2><button class="g" data-a="close">Close</button></div>
  ${lock?'<p class="mut">Completed challenges are locked. An admin can undo the completion.</p>':ctl}
  ${isAdm()&&!lock?`<div class="row" style="margin-top:10px"><select id="padm">${S.profiles.map(p=>`<option value="${p.id}">${esc(p.display_name)}</option>`).join('')}</select><button class="g" data-a="padd" data-i="${i.id}">Add player</button><button class="g" data-a="prem" data-i="${i.id}">Remove player</button></div>`:''}
  <h2 style="margin-top:14px">Progress history</h2><div class="log">${S.hist.map(h=>`<div><span class="mut">${new Date(h.created_at).toLocaleTimeString()}</span> ${nm(h.user_id)} updated ${lab(h.progression_key)}: ${h.old_value} → ${h.new_value}</div>`).join('')||'<span class="mut">No changes yet.</span>'}</div></div>`;
}

function tick(){
  const c=$('#clock');if(c&&S.win)c.textContent=fmt(elapsed(S.win));
  document.querySelectorAll('.sims').forEach(e=>{const r=(+e.dataset.end-(Date.now()+off))/1000;e.textContent=r>0?'⏱ '+fmt(r)+' left':'⏱ time is up';});
}

/* ---------- actions ---------- */
const val = id => $(id)?.value;
const A = {
  logout:()=>db.auth.signOut(),
  join:d=>R('set_participant',{p_instance:d.i,p_user:me.id,p_join:true}),
  leave:d=>R('set_participant',{p_instance:d.i,p_user:me.id,p_join:false}),
  open:async d=>{S.open=d.i;await hist();},
  close:()=>{S.open=null;render();},
  inc:d=>R('update_progress',{p_instance:d.i,p_key:d.k,p_op:'inc',p_value:+d.v}),
  set:d=>R('update_progress',{p_instance:d.i,p_key:d.k,p_op:'set',p_value:d.v!==undefined?+d.v:+val('#in-'+d.k)}),
  win:d=>R('update_progress',{p_instance:d.i,p_key:d.k,p_op:'win'}),
  loss:d=>confirm('Record a loss? The current streak resets to 0.')&&R('update_progress',{p_instance:d.i,p_key:d.k,p_op:'loss'}),
  contrib:d=>R('add_contribution',{p_instance:d.i,p_user:val('#pl'),p_amount:+val('#amt'),p_set:d.m==='set',p_note:val('#lang')||null}),
  vote:d=>R('cast_vote',{p_instance:d.i,p_target:val(`#v-${d.t}-${d.i}`),p_type:d.t}),
  create:()=>{const n=prompt('Name of the new Win Challenge:','Win Challenge');if(n)R('create_win',{p_name:n});},
  wa:d=>(d.w==='start'||d.w==='end'?confirm(d.w==='start'?'Start the global timer now?':'End the whole Win Challenge now? This stops the timer.'):true)&&R('win_action',{p_id:S.win.id,p_action:d.w}),
  addall:d=>R('admin_add_all',{p_instance:d.i}),
  force:d=>confirm('Mark complete even though requirements are not met? This is logged.')&&R('admin_set_complete',{p_instance:d.i,p_complete:true}),
  reopen:d=>confirm('Undo this completion?')&&R('admin_set_complete',{p_instance:d.i,p_complete:false}),
  reset:d=>confirm('Reset all progress for this challenge? History is kept.')&&R('admin_set_complete',{p_instance:d.i,p_complete:false,p_reset:true}),
  padd:d=>R('set_participant',{p_instance:d.i,p_user:val('#padm'),p_join:true}),
  prem:d=>confirm('Remove this player from the challenge?')&&R('set_participant',{p_instance:d.i,p_user:val('#padm'),p_join:false}),
  role:d=>confirm('Change this player\'s role?')&&R('admin_set_role',{p_user:d.u,p_role:d.r}),
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset);});

/* ---------- hover photo tooltip ---------- */
const tip=document.createElement('img');tip.id='pimg';tip.alt='';document.body.appendChild(tip);
tip.onerror=()=>{tip.style.display='none';toast('The hover image could not be loaded. Check the link on the PLAYER_IMAGES line (the Supabase bucket must be public).');};
document.addEventListener('mouseover',e=>{const n=e.target.closest&&e.target.closest('.pn');if(n){tip.src=n.dataset.img;tip.style.display='block';}});
document.addEventListener('mousemove',e=>{if(tip.style.display!=='block')return;tip.style.left=Math.max(4,Math.min(e.clientX+16,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=Math.max(4,Math.min(e.clientY+16,innerHeight-tip.offsetHeight-8))+'px';});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('.pn'))tip.style.display='none';});

/* ---------- boot ---------- */
async function start(session){
  me=session?.user||null;
  if(!me){S.win=null;if(chOnline){db.removeAllChannels();chOnline=null;}authView();return;}
  await load();
  if(!chOnline){
    db.channel('changes').on('postgres_changes',{event:'*',schema:'public'},sched).subscribe();
    chOnline=db.channel('online',{config:{presence:{key:me.id}}});
    chOnline.on('presence',{event:'sync'},()=>{S.online=Object.keys(chOnline.presenceState());render();}).subscribe(async s=>{if(s==='SUBSCRIBED')await chOnline.track({at:Date.now()});});
  }
}
db.auth.onAuthStateChange((ev,session)=>{if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>start(session),0);});
setInterval(tick,1000);setInterval(()=>me&&load(),60000);
</script>
</body>
</html>
